name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Demo run on the sample PR diff
        run: node dist/cli.js pr --css fixtures/css/globals.css --diff fixtures/diff/sample.diff --figma-json fixtures/figma/sample.json
